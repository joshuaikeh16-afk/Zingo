<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Kaidra</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <!-- Preconnect for fast webfonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-[#0b0c10] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">
    <!-- Ambient Background Glows -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-lg h-96 glow-ambient-violet pointer-events-none opacity-60"></div>
    <div class="fixed bottom-0 right-0 w-80 h-80 glow-ambient-rose pointer-events-none opacity-40"></div>

    <!-- Top Navigation Bar (Mobile Header) -->
    <header class="w-full max-w-md mx-auto px-6 pt-6 pb-2 flex items-center justify-between relative z-10">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 via-indigo-500 to-rose-500 p-0.5 shadow-lg shadow-violet-500/20">
          <div class="w-full h-full bg-[#0b0c10] rounded-[10px] flex items-center justify-center">
            <span class="font-heading font-bold text-transparent bg-clip-text bg-gradient-to-tr from-violet-400 to-rose-400 text-lg">K</span>
          </div>
        </div>
        <span class="font-heading font-bold text-xl tracking-tight text-white">Kaidra</span>
      </div>
      <a href="/onboarding.html" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1 bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-full">
        <span>Skip to Onboarding</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </a>
    </header>

    <!-- Main Auth Card Container -->
    <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col justify-center relative z-10">
      <div class="glass-panel rounded-3xl p-6 sm:p-8 shadow-2xl border border-slate-800/80 relative overflow-hidden">
        
        <!-- Top Banner Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-violet-500/10 border border-violet-500/20 text-violet-300 text-xs font-medium mb-6">
          <span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse"></span>
          <span>Anime & Social Experience</span>
        </div>

        <!-- Dynamic Header -->
        <div class="mb-6">
          <h1 id="auth-title" class="font-heading font-bold text-2xl sm:text-3xl text-white tracking-tight">
            Welcome Back
          </h1>
          <p id="auth-subtitle" class="text-sm text-slate-400 mt-1.5 leading-relaxed">
            Sign in to access your feed & friends
          </p>
        </div>

        <!-- Error Message Alert -->
        <div id="auth-error-message" class="hidden p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-medium flex items-start gap-2.5 mb-5" role="alert">
          <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <span class="flex-1">Invalid credentials. Please try again.</span>
        </div>

        <!-- Loading Spinner -->
        <div id="auth-loading" class="hidden flex items-center justify-center gap-2.5 text-violet-300 text-xs font-medium py-3 bg-violet-950/40 rounded-2xl border border-violet-800/40 mb-5 animate-pulse">
          <svg class="w-4 h-4 animate-spin text-violet-400" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Authenticating account...</span>
        </div>

        <!-- Credentials Form -->
        <form onsubmit="return false;" class="space-y-4">
          
          <!-- Email Input -->
          <div>
            <label for="email-input" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
              Email Address
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
              <input
                type="email"
                id="email-input"
                name="email"
                placeholder="name@example.com"
                required
                class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-800 rounded-2xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all"
              />
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password-input" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">
                Password
              </label>
              <a href="#" class="text-xs text-violet-400 hover:text-violet-300 transition-colors">Forgot?</a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              </div>
              <input
                type="password"
                id="password-input"
                name="password"
                placeholder="••••••••"
                required
                class="w-full pl-10 pr-4 py-3 bg-slate-900/90 border border-slate-800 rounded-2xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 transition-all"
              />
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button
              id="auth-submit-btn"
              type="submit"
              class="w-full py-3.5 px-4 bg-gradient-to-r from-violet-600 via-indigo-600 to-rose-500 hover:from-violet-500 hover:to-rose-400 text-white font-semibold text-sm rounded-2xl shadow-lg shadow-violet-600/25 active:scale-[0.99] transition-all cursor-pointer flex items-center justify-center gap-2"
            >
              Sign In
            </button>
          </div>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center gap-3">
          <div class="h-px bg-slate-800 flex-1"></div>
          <span class="text-[11px] font-medium text-slate-500 uppercase tracking-wider">or continue with</span>
          <div class="h-px bg-slate-800 flex-1"></div>
        </div>

        <!-- Social Logins -->
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button type="button" class="py-2.5 px-3 bg-slate-900/80 hover:bg-slate-800 border border-slate-800 rounded-2xl text-xs font-medium text-slate-300 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-slate-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="py-2.5 px-3 bg-slate-900/80 hover:bg-slate-800 border border-slate-800 rounded-2xl text-xs font-medium text-slate-300 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-4 h-4 text-indigo-400" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            <span>Discord</span>
          </button>
        </div>

        <!-- Mode Toggle Switcher Link -->
        <div class="text-center pt-2">
          <button
            type="button"
            id="auth-toggle-mode"
            class="text-xs text-slate-400 hover:text-violet-300 font-medium transition-colors cursor-pointer underline underline-offset-4 decoration-slate-700 hover:decoration-violet-400"
          >
            Don't have an account? Sign Up
          </button>
        </div>

      </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto px-6 py-4 text-center text-[11px] text-slate-600 relative z-10">
      <p>Kaidra Social Layout • Built for Mobile Performance</p>
    </footer>

    <!-- Script Import (Strict Requirement) -->
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
