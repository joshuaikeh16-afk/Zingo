<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Profile — Kaidra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="/css/onboarding.css" />
  </head>
  <body class="onboarding-body">
    <header class="onboarding-header">
      <a href="/signup.html" class="onboarding-back" aria-label="Use a different email">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7" /></svg>
        <span>Back</span>
      </a>
      <div class="onboarding-brand"><div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5ZM2 17l10 5 10-5M2 12l10 5 10-5" /></svg></div><span>Kaidra</span></div>
      <span class="onboarding-step">Step 2 of 2</span>
    </header>
    <main class="onboarding-main">
      <section class="onboarding-card" aria-labelledby="onboarding-title">
        <p class="onboarding-kicker">Your space, your signal</p>
        <h1 id="onboarding-title" class="onboarding-title">Create your profile</h1>
        <p class="onboarding-subtitle">Choose a few details so Kaidra can shape a feed around what you actually enjoy.</p>
        <div id="onboarding-error" class="onboarding-error hidden" role="alert"></div>
        <form class="onboarding-form" onsubmit="return false;">
          <div class="avatar-upload">
            <div class="avatar-circle">
              <img id="avatar-preview" src="" alt="Avatar preview" class="hidden" />
              <div id="avatar-placeholder" class="avatar-placeholder">
                <div><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 0 1 2-2h.93a2 2 0 0 0 1.66-.89l.82-1.22A2 2 0 0 1 10.07 4h3.86a2 2 0 0 1 1.66.89l.82 1.22A2 2 0 0 0 18.07 7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg><br />Add photo</div>
              </div>
              <label for="avatar-input" class="avatar-add" aria-label="Upload avatar"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14" /></svg></label>
              <input type="file" id="avatar-input" accept="image/*" class="hidden" />
            </div>
            <p class="avatar-caption">Optional profile photo</p>
          </div>
          <div class="onboarding-field">
            <div class="interest-header"><label for="username-input" class="onboarding-label">Username</label><span id="username-availability" class="interest-hint"></span></div>
            <div class="onboarding-input-wrap"><span class="onboarding-at">@</span><input id="username-input" name="username" type="text" placeholder="your_handle" autocomplete="off" required class="onboarding-input" /></div>
          </div>
          <div class="onboarding-field">
            <div class="interest-header"><label class="onboarding-label">What are you into?</label><span class="interest-hint">Pick any that fit</span></div>
            <div class="interest-grid" id="interest-chips-container">
              <button type="button" class="interest-chip" data-interest="shonen_action"><span class="interest-icon">⚔️</span><span class="interest-copy"><strong>Shonen &amp; Action</strong><small>Big battles, rivals, power-ups</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="slice_of_life"><span class="interest-icon">🍜</span><span class="interest-copy"><strong>Slice of Life</strong><small>Cozy stories and daily moments</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="fantasy_romance"><span class="interest-icon">✨</span><span class="interest-copy"><strong>Fantasy &amp; Romance</strong><small>Magic, feelings, other worlds</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="manga_comics"><span class="interest-icon">📚</span><span class="interest-copy"><strong>Manga &amp; Comics</strong><small>Panels, creators, new releases</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="gaming_esports"><span class="interest-icon">🎮</span><span class="interest-copy"><strong>Gaming &amp; Esports</strong><small>Games, streams, competitive play</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="music_idols"><span class="interest-icon">🎤</span><span class="interest-copy"><strong>Music &amp; Idols</strong><small>Artists, releases, fan culture</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="vtubers_creators"><span class="interest-icon">🎙️</span><span class="interest-copy"><strong>VTubers &amp; Creators</strong><small>Live creators and online communities</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="world_news"><span class="interest-icon">🌍</span><span class="interest-copy"><strong>World &amp; Tech News</strong><small>What is happening beyond fandom</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="football"><span class="interest-icon">⚽</span><span class="interest-copy"><strong>Football</strong><small>Matches, clubs, leagues, transfers</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="movies_tv"><span class="interest-icon">🎬</span><span class="interest-copy"><strong>Movies &amp; TV</strong><small>New releases, reviews, and series</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="cartoons_family"><span class="interest-icon">🧸</span><span class="interest-copy"><strong>Cartoons &amp; Family</strong><small>Animation for every generation</small></span><span class="interest-check">✓</span></button>
              <button type="button" class="interest-chip" data-interest="kdrama"><span class="interest-icon">🇰🇷</span><span class="interest-copy"><strong>K-Dramas</strong><small>Romance, thrillers, and Korean TV</small></span><span class="interest-check">✓</span></button>
            </div>
          </div>
          <button id="onboarding-submit-btn" type="submit" class="onboarding-submit">Complete profile <span aria-hidden="true">→</span></button>
        </form>
      </section>
    </main>
    <footer class="onboarding-footer">Kaidra — Anime, News &amp; Friends</footer>
    <script type="module" src="/js/onboarding.js"></script>
  </body>
</html>
