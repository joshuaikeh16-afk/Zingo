<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Kaidra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body">

    <header class="auth-header">
      <div class="auth-brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span>Kaidra</span>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">

        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle" id="reset-subtitle">Verifying your reset link…</p>

        <div id="reset-error-message" class="auth-error-message hidden" role="alert"></div>
        <div id="reset-loading" class="auth-loading hidden">Saving…</div>

        <form id="reset-form" onsubmit="return false;" class="hidden">
          <div class="auth-field">
            <label for="new-password-input">New Password</label>
            <input type="password" id="new-password-input" placeholder="At least 6 characters" required class="auth-input" />
          </div>

          <div class="auth-field">
            <label for="confirm-password-input">Confirm Password</label>
            <input type="password" id="confirm-password-input" placeholder="Re-enter your new password" required class="auth-input" />
          </div>

          <button id="reset-submit-btn" type="submit" class="auth-submit-btn">Save New Password</button>
        </form>

        <p class="auth-switch-link" id="reset-back-link" style="margin-top:18px;"><a href="/auth.html">Back to Sign In</a></p>

      </div>
    </main>

    <footer class="auth-footer">Kaidra — Anime, News &amp; Friends</footer>

    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
