<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password — Kaidra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/components.css" /><link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body auth-reset">

    <header class="auth-header">
      <a class="auth-brand" href="/auth.html"><span class="brand-spark">✦</span>kaidra<span class="brand-dot">.</span></a>
    </header>

    <main class="auth-main">
      <div class="auth-card">

        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle" id="reset-subtitle">Verifying your reset link…</p>

        <div id="reset-error-message" class="auth-error-message hidden" role="alert"></div>
        <div id="reset-loading" class="auth-loading hidden">Saving…</div>

        <form id="reset-form"  class="hidden">
          <div class="auth-field">
            <label for="new-password-input">New Password</label>
            <div class="password-input-wrap">
              <input type="password" id="new-password-input" placeholder="At least 6 characters" autocomplete="new-password" required class="auth-input" />
              <button type="button" class="password-toggle" data-password-target="new-password-input" aria-label="Show password">Show</button>
            </div>
          </div>

          <div class="auth-field">
            <label for="confirm-password-input">Confirm Password</label>
            <div class="password-input-wrap">
              <input type="password" id="confirm-password-input" placeholder="Re-enter your new password" autocomplete="new-password" required class="auth-input" />
              <button type="button" class="password-toggle" data-password-target="confirm-password-input" aria-label="Show password">Show</button>
            </div>
          </div>

          <button id="reset-submit-btn" type="submit" class="primary-button auth-submit-btn">Save New Password</button>
        </form>

        <p class="auth-switch-link" id="reset-back-link" style="margin-top:18px;"><a href="/auth.html">Back to Sign In</a></p>

      </div>
    </main>

    <footer class="auth-footer">Find your favourites. Find your people.</footer>

    <script type="module" src="/js/reset-password.js"></script>
  </body>
</html>
