<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up — Kaidra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-body" data-auth-mode="signup">

    <header class="auth-header">
      <div class="auth-brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <span>Kaidra</span>
      </div>
    </header>

    <main class="auth-main">
      <div class="auth-card">

        <span class="auth-badge">Anime & Social Experience</span>

        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Kaidra — anime, news &amp; friends in one place</p>

        <div id="auth-error-message" class="auth-error-message hidden" role="alert"></div>
        <div id="auth-loading" class="auth-loading hidden">Creating account…</div>

        <form onsubmit="return false;">
          <div class="auth-field">
            <label for="email-input">Email Address</label>
            <input type="email" id="email-input" name="email" placeholder="name@example.com" required class="auth-input" />
          </div>

          <div class="auth-field">
            <div class="auth-field-row">
              <label for="password-input" style="margin-bottom:0;">Password</label>
            </div>
            <div class="password-input-wrap">
              <input type="password" id="password-input" name="password" placeholder="At least 6 characters" autocomplete="new-password" required class="auth-input" />
              <button type="button" class="password-toggle" data-password-target="password-input" aria-label="Show password">Show</button>
            </div>
          </div>

          <button id="auth-submit-btn" type="submit" class="auth-submit-btn">Sign Up</button>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>

        <div class="auth-social-row">
          <button id="google-auth-btn" type="button" class="auth-social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.761H12.545z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="auth-social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            <span>Discord</span>
          </button>
        </div>

        <p class="auth-switch-link">Already have an account? <a href="/auth.html">Sign In</a></p>

      </div>
    </main>

    <footer class="auth-footer">Kaidra — Anime, News &amp; Friends</footer>

    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
